# LanFu release pipeline.
#
# Cut a release by pushing a tag:  git tag lanfu-v0.1.0 && git push github lanfu-v0.1.0
# Manual runs: Actions -> LanFu Release -> Run workflow (explicit version).
#
# Layout note: the shipped dependency tree is FLAT (nodeLinker=hoisted). Inno Setup
# cannot preserve pnpm's symlinked layout, and the peer-encoded .pnpm directory names
# exceed MAX_PATH on Windows. The packaging jobs therefore start from a clean checkout
# and never have to convert an existing isolated tree in place. See
# docs/lanfu/windows-packaging.md.
name: LanFu Release

on:
  push:
    tags:
      # v0.4.7+ is the native format for the in-app updater (Updatum strips only a
      # leading v, so a lanfu-v prefix would parse to nothing). lanfu-v* stays
      # accepted for historical tags.
      - "v*"
      - "lanfu-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "LanFu product version, for example 0.1.0"
        required: true
        type: string
      publish:
        description: "Create a draft GitHub Release with the built assets"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lanfu-release-${{ github.ref }}
  # A stuck run must not hold the queue: a freshly pushed tag supersedes it.
  cancel-in-progress: true

env:
  NODE_RUNTIME_VERSION: 24.19.0

jobs:
  # GitHub expressions have no replace(); resolve the version in a shell step.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            # Tags are v0.4.7+ (updater-native); lanfu-v* is the historical form.
            # Strip either prefix - a leading v would poison the Debian package
            # version, which must start with a digit.
            version="${GITHUB_REF_NAME#lanfu-v}"
            version="${version#v}"
          fi
          if [ -z "$version" ]; then echo "could not resolve a version" >&2; exit 1; fi
          echo "resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Build dist once with the repository's own isolated layout, then hand it to the
  # packaging jobs so they can use a flat production-only dependency tree.
  build:
    name: Build dist
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Fail fast: every release must say what changed in THIS version. The file
      # is published verbatim as the GitHub Release body, which the in-app update
      # dialog shows. Missing it used to fall back to a fixed blurb, so the
      # update prompt looked identical on every release.
      - name: Verify the per-version release notes exist
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          if [ ! -f "docs/lanfu/releases/${VERSION}.md" ]; then
            echo "::error::missing docs/lanfu/releases/${VERSION}.md — every release must say what changed in this version"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}
          cache: pnpm
      # The app reads lanfu.productVersion from package.json at RUNTIME (see
      # src/version.ts). Stamp the tag version here so the built dist provenance
      # agrees with it; every staging job re-stamps its own fresh checkout via
      # scripts/stamp-product-version.mjs.
      - name: Stamp the LanFu product version
        run: node scripts/stamp-product-version.mjs "${{ needs.resolve.outputs.version }}"
      - run: pnpm install --frozen-lockfile
      - name: Build dist and Control UI
        run: pnpm build
      # dist holds tens of thousands of files; upload-artifact v4 runs out of
      # heap while hashing them, so ship one archive instead.
      - name: Archive dist
        run: |
          # The build leaves symlinked node_modules under dist/extensions/*; they point
          # back into the repository store, cannot survive a Windows extraction, and are
          # redundant because the shipped app resolves plugins from its flat node_modules.
          tar -czf dist.tar.gz --exclude='*/node_modules' dist packages/ai/dist
      - uses: actions/upload-artifact@v4
        with:
          name: lanfu-dist
          path: dist.tar.gz
          retention-days: 3

  windows-exe:
    name: Windows installer
    needs: [resolve, build]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}
          cache: pnpm
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: lanfu-dist
      - name: Extract dist
        shell: pwsh
        run: |
          # bsdtar silently truncates paths beyond MAX_PATH on Windows, which
          # leaves dist half extracted; 7-Zip handles long paths.
          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          # 7-Zip writes warnings to stderr, which GitHub's pwsh turns into a
          # terminating error under its default ErrorActionPreference.
          $ErrorActionPreference = 'Continue'
          & $sevenZip x dist.tar.gz "-o." -y | Out-Null
          & $sevenZip x dist.tar "-o." -y | Out-Null
          Remove-Item dist.tar, dist.tar.gz -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path 'dist\index.js')) { throw 'dist extraction failed' }
          Write-Output 'extracted dist'
      - name: Switch the workspace to a flat dependency layout
        shell: pwsh
        run: |
          $ws = Get-Content pnpm-workspace.yaml -Raw
          if ($ws -notmatch 'nodeLinker: isolated') { throw 'unexpected nodeLinker value' }
          $ws = $ws.Replace('nodeLinker: isolated', 'nodeLinker: hoisted')
          # --prod drops dev-only patches, which pnpm otherwise rejects.
          if ($ws -notmatch 'allowUnusedPatches') { $ws = $ws + "`nallowUnusedPatches: true`n" }
          Set-Content pnpm-workspace.yaml -Value $ws -NoNewline
          Write-Output "workspace switched to hoisted"
      - name: Install flat production dependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      # Each staging job checks out the repo itself, so the build job's stamp
      # does not carry over; without this the installer ships the stale manual
      # bump (0.4.29 shipped as the banner product version through 0.4.33).
      - name: Stamp the LanFu product version
        shell: pwsh
        run: node scripts/stamp-product-version.mjs "${{ needs.resolve.outputs.version }}"
      - name: Stage the application tree
        shell: pwsh
        run: |
          $app = "release\app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          # robocopy copes with deep trees where Copy-Item hits MAX_PATH.
          robocopy dist (Join-Path $app 'dist') /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy dist failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Copy-Item node_modules -Destination $app -Recurse
          # The root .mjs files are runtime launchers (openclaw.mjs, node-host-launcher,
          # node-runtime-*, gateway-*, cli-root-options), not build leftovers.
          Copy-Item *.mjs -Destination $app
          foreach ($f in @("package.json","LICENSE","THIRD_PARTY_NOTICES.md")) {
            if (Test-Path $f) { Copy-Item $f -Destination $app }
          }
          $ai = Join-Path $app "node_modules\@openclaw\ai"
          if (Test-Path $ai) { Remove-Item -Recurse -Force $ai }
          New-Item -ItemType Directory -Force -Path $ai | Out-Null
          Copy-Item "packages\ai\dist" -Destination $ai -Recurse
          Copy-Item "packages\ai\package.json" -Destination $ai
          # Workspace templates (AGENTS.md/SOUL.md/IDENTITY.md/USER.md, roles/) are
          # loaded at runtime from docs/reference/templates under the package root;
          # every agent turn needs them. Without this the first chat dies with
          # "Missing workspace template". The trim step only touches node_modules
          # and dist, so this location is safe.
          New-Item -ItemType Directory -Force -Path (Join-Path $app "docs\reference") | Out-Null
          Copy-Item "docs\reference\templates" -Destination (Join-Path $app "docs\reference") -Recurse
          foreach ($p in @("@openai\codex-win32-x64","@anthropic-ai\claude-agent-sdk-win32-x64","@github\copilot-sdk-win32-x64","onnxruntime-node","@lancedb\lancedb-win32-x64-msvc")) {
            $target = Join-Path $app ("node_modules\" + $p)
            if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          }
          Write-Output "staged app tree"
      - name: Trim development-only files from the payload
        shell: pwsh
        run: |
          # Employees install over a slow link, so the payload only carries what the
          # runtime needs. The dependency tree ships source maps, type declarations,
          # docs and test fixtures that nothing loads at runtime; dropping them halves
          # the file count (112k -> 54k) and cuts ~350 MB, which is the bulk of the
          # installation time. The smoke test below still installs and starts the
          # gateway, so a wrongly removed file fails the build instead of the employee.
          $app = "release\app"
          $targets = @((Join-Path $app "node_modules"), (Join-Path $app "dist"))
          $extensions = @(".map", ".md", ".markdown", ".txt", ".ts", ".tsx", ".mts", ".cts", ".flow")
          $removedFiles = 0
          $freedBytes = 0L
          foreach ($root in $targets) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem $root -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $name = $_.Name
              if ($name -like "LICENSE*" -or $name -like "NOTICE*") { return }
              $drop = $false
              if ($name -like "*.d.ts") { $drop = $true }
              elseif ($extensions -contains $_.Extension) { $drop = $true }
              if ($drop) {
                $freedBytes += $_.Length
                Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
                $script:removedFiles++
              }
            }
          }
          foreach ($name in @("test","tests","__tests__","__mocks__","spec","docs","example","examples",".github",".vscode")) {
            foreach ($root in $targets) {
              if (-not (Test-Path $root)) { continue }
              Get-ChildItem $root -Recurse -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq $name } |
                ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }
          for ($i = 0; $i -lt 3; $i++) {
            foreach ($root in $targets) {
              if (-not (Test-Path $root)) { continue }
              Get-ChildItem $root -Recurse -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { (Get-ChildItem $_.FullName -Force -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0 } |
                ForEach-Object { Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue }
            }
          }
          $left = Get-ChildItem $app -Recurse -File -ErrorAction SilentlyContinue
          Write-Output ("trimmed: removed $removedFiles files (" + [math]::Round($freedBytes / 1MB) + " MB); payload now " + $left.Count + " files, " + [math]::Round(($left | Measure-Object Length -Sum).Sum / 1MB) + " MB")
          if (-not (Test-Path (Join-Path $app "package.json"))) { throw "app tree looks wrong after trimming" }

      - name: Download the pinned Node runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://nodejs.org/dist/v${{ env.NODE_RUNTIME_VERSION }}/node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-tmp
          Move-Item "node-tmp\node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64" "release\runtime"
          # The gateway only needs node.exe. npm/npx/corepack and the bundled
          # npm node_modules are dead weight in every install (~12 MB installed).
          foreach ($name in @("npm","npx","npx.cmd","npx.ps1","npm.cmd","npm.ps1","corepack","corepack.cmd","node_modules","install_tools.bat","nodevars.bat","CHANGELOG.md","README.md")) {
            $target = Join-Path "release\runtime" $name
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          }
      - name: Assemble the release root
        shell: pwsh
        run: |
          Copy-Item packaging\windows\lanfu.cmd release\
          Copy-Item packaging\windows\post-install.ps1 release\
          Copy-Item packaging\windows\uninstall.ps1 release\
          Copy-Item packaging\windows\ensure-gateway.ps1 release\
          Copy-Item packaging\windows\approve-pairing.ps1 release\
          Copy-Item packaging\windows\lanfu.ico release\
          Copy-Item packaging\windows\LanFu.iss release\
          # Inno Setup ships no Simplified Chinese language file; it is vendored and staged next to LanFu.iss.
          Copy-Item packaging\windows\ChineseSimplified.isl release
      # ---- Desktop shell (tray + native window), built from the LanFu fork of the -
      # ---- upstream Windows Hub. Public repository, so no cross-repo token is needed.
      - name: Check out the desktop shell source
        uses: actions/checkout@v4
        with:
          repository: lwhguge-dot/lanfu-windows
          ref: main
          path: hub-src
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the desktop shell payload
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          # GitVersion.MsBuild needs the full history, hence fetch-depth: 0 above.
          dotnet restore hub-src\src\OpenClaw.Tray.WinUI -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "hub restore failed" }
          # LANFU_UPDATE_TOKEN (Actions secret) carries a read-only fine-grained
          # GitHub PAT that authenticates the shell's update checks (60 -> 5000
          # req/h); without it the shell falls back to anonymous checks.
          dotnet publish hub-src\src\OpenClaw.Tray.WinUI -c Release -r win-x64 --self-contained --no-restore `
            -o hub-publish -p:Version=$version -p:InformationalVersion=$version "-p:UpdateCheckGitHubToken=${{ secrets.LANFU_UPDATE_TOKEN }}"
          if ($LASTEXITCODE -ne 0) { throw "hub publish failed" }
          if (-not (Test-Path "hub-publish\LanFu.exe")) { throw "hub publish output missing" }

          # The shell is pinned to zh-CN, so .NET satellite resource folders for every
          # other language are dead weight in the installer.
          $satellites = @("cs","da","de","el","es","fi","fr","he","hi","hu","id","it","ja","ko","nb","nl","pl","pt-BR","pt-PT","ro","ru","sk","sv","th","tr","uk","vi","zh-TW")
          foreach ($name in $satellites) {
            $dir = Join-Path "hub-publish" $name
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }
          $files = Get-ChildItem hub-publish -Recurse -File
          Write-Output ("desktop shell payload: " + $files.Count + " files, " + [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB) + " MB")

          # WinUI 3 never uses WPF/WinForms, but self-contained publish drags in the
          # WindowsDesktop runtime pack (~51 MB installed). Drop the unused
          # assemblies before packing; the smoke test asserts they are gone.
          $unusedAssemblies = @(
            "PresentationFramework.dll", "PresentationCore.dll", "WindowsBase.dll",
            "System.Xaml.dll", "ReachFramework.dll", "System.Printing.dll",
            "System.Windows.Forms.dll", "System.Windows.Forms.Design.dll",
            "System.Windows.Forms.Primitives.dll", "System.Drawing.Design.dll",
            "Accessibility.dll", "System.Windows.Input.Manipulations.dll"
          )
          $removedAssemblies = 0
          foreach ($name in $unusedAssemblies) {
            $path = Join-Path "hub-publish" $name
            if (Test-Path $path) { Remove-Item $path -Force; $removedAssemblies++ }
          }
          Write-Output ("trimmed " + $removedAssemblies + " unused WPF/WinForms assemblies from the shell payload")

          New-Item -ItemType Directory -Force -Path "release\hub" | Out-Null
          robocopy hub-publish "release\hub" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "staging the shell payload failed" }
          $global:LASTEXITCODE = 0

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ needs.resolve.outputs.version }}" "release\LanFu.iss"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "release\out\LanFu-Setup-x64.exe" release-assets\
      - name: Checksums
        shell: pwsh
        run: |
          Push-Location release-assets
          $lines = Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          $lines | ForEach-Object { Write-Output $_ }
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: lanfu-windows-${{ needs.resolve.outputs.version }}
          path: release-assets/**

      - name: Smoke test the installer on the runner
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Step($t) { Write-Output ("[smoke] " + $t) }
          function Show-Diagnostics {
            Write-Output "--- installer setup log (tail) ---"
            Get-Content (Join-Path $env:TEMP "lanfu-setup.log") -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
            Write-Output "--- post-install log ---"
            Get-Content (Join-Path $env:TEMP "lanfu-post-install.log") -Tail 80 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
            Write-Output "--- gateway watchdog log ---"
            Get-Content (Join-Path $env:TEMP "lanfu-gateway-watchdog.log") -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
            Write-Output "--- pairing/identity log ---"
            Get-Content (Join-Path $env:TEMP "lanfu-pairing.log") -Tail 30 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
            Write-Output "--- app\node_modules (openclaw entry) ---"
            $nm = Join-Path $env:LOCALAPPDATA "Programs\LanFu\app\node_modules"
            if (Test-Path $nm) {
              Get-ChildItem $nm -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*openclaw*" } | ForEach-Object {
                Write-Output ("  " + $_.Name + " link=" + $_.LinkType + " target=" + $_.Target)
              }
              Write-Output ("  node_modules entries: " + (Get-ChildItem $nm -Force -ErrorAction SilentlyContinue | Measure-Object).Count)
            } else { Write-Output "  node_modules missing" }
            Write-Output "--- HKCU Run ---"
            Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Output
          }
          function Fail($t) { Show-Diagnostics; throw ("[smoke] " + $t) }

          Step "installing"
          # Simulate an employee who used native Windows OpenClaw before: seed a legacy
          # state dir with a distinctive token and a marker file. The installer must
          # migrate it (the gateway's own .openclaw -> .lanfu move) instead of minting
          # a fresh state on top of it.
          $legacyDir = Join-Path $env:USERPROFILE ".openclaw"
          $legacyToken = "e2b" + ("0" * 43) + "c1"
          New-Item -ItemType Directory -Force -Path (Join-Path $legacyDir "state") | Out-Null
          "legacy-marker-7f3a" | Set-Content (Join-Path $legacyDir "state" "marker.txt")
          @{ gateway = @{ auth = @{ token = $legacyToken } } } |
            ConvertTo-Json -Depth 8 | Set-Content (Join-Path $legacyDir "openclaw.json")
          $setup = "release-assets\LanFu-Setup-x64.exe"
          $setupLog = Join-Path $env:TEMP "lanfu-setup.log"
          Remove-Item $setupLog -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOCANCEL","/LOG=$setupLog") -PassThru
          if (-not $proc.WaitForExit(1800000)) { try { $proc.Kill() } catch { }; Fail "installer did not finish within 30 minutes" }
          Step ("installer exit code " + $proc.ExitCode)
          if ($proc.ExitCode -ne 0) { Fail "installer returned $($proc.ExitCode)" }

          $root = @(
            (Join-Path $env:LOCALAPPDATA "Programs\LanFu"),
            (Join-Path $env:ProgramFiles "LanFu"),
            (Join-Path ${env:ProgramFiles(x86)} "LanFu")
          ) | Where-Object { Test-Path (Join-Path $_ "app\dist\index.js") } | Select-Object -First 1
          if (-not $root) { Fail "installed app tree not found in any expected location" }
          Step "installed to $root"

          # The gateway resolves "openclaw/plugin-sdk/*" through this junction. The
          # installer must create it: relying on the launcher to create it on first run
          # was too late, the migration detection failed and the gateway refused to
          # become ready, which is what skipped pairing on a real install.
          Step "checking the dependency self-link"
          $selfLink = Join-Path $root "app\node_modules\openclaw"
          if (-not (Test-Path $selfLink)) {
            Write-Output ("[smoke] self-link path: " + $selfLink)
            Write-Output ("[smoke] node_modules exists: " + (Test-Path (Join-Path $root "app\node_modules")))
            Fail "the installer did not create the dependency self-link"
          }
          Step "self-link present"

          Step "waiting for the gateway"
          $ready = $false
          for ($i = 0; $i -lt 48; $i++) {
            Start-Sleep -Seconds 5
            try { $r = Invoke-WebRequest "http://127.0.0.1:18789/" -UseBasicParsing -TimeoutSec 4; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch { }
          }
          if (-not $ready) {
            Write-Output "--- post-install log ---"
            Get-Content (Join-Path $env:TEMP "lanfu-post-install.log") -Tail 60 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
            Write-Output "--- gateway log ---"
            Get-ChildItem (Join-Path $env:TEMP "openclaw") -Filter *.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Get-Content $_.FullName -Tail 30 | ForEach-Object { Write-Output $_ } }
            Fail "installed gateway did not become ready"
          }
          Step "gateway answered HTTP 200"

          # Minimal wiring (2026-10-12 decision): the installer mints the gateway token
          # and pre-wires the shell's connection record, because a fresh gateway rejects
          # every anonymous client and employees have no CLI to mint one themselves.
          # 0.4.3: the legacy .openclaw seeded above must be migrated FIRST (the gateway
          # only migrates while .lanfu is absent), its token preserved, and the company
          # model seeded on top. Model/channel edits beyond the seed stay the employee's.
          Step "checking the legacy migration ran"
          $gatewayConfig = Join-Path $env:USERPROFILE ".lanfu\lanfu.json"
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".lanfu\state\marker.txt"))) { Fail "legacy state files were not migrated into .lanfu" }
          # The migration renames .openclaw into .lanfu and leaves a junction at
          # the old path, so the legacy location must still resolve.
          if (-not (Test-Path (Join-Path $legacyDir "state\marker.txt"))) { Fail "the legacy .openclaw path no longer resolves after migration" }
          Step "legacy state migrated, legacy path still resolves"

          Step "checking the config-file rename migration"
          # 0.4.33: the gateway physically renames the legacy openclaw.json to
          # lanfu.json on first startup, so the old name must be gone once ready.
          if (Test-Path (Join-Path $env:USERPROFILE ".lanfu\openclaw.json")) { Fail "legacy openclaw.json still exists; the gateway rename migration did not run" }
          Step "config file renamed openclaw.json -> lanfu.json"

          Step "checking the CLI version banner"
          # 0.4.34: the launcher fast path must agree with the stamped product
          # version and the core upstream label; a stale manual bump or the
          # upstream brand here means the staging stamp regressed.
          $bannerFile = Join-Path $env:TEMP "lanfu-version.txt"
          Remove-Item $bannerFile -Force -ErrorAction SilentlyContinue
          $null = & (Join-Path $env:SystemRoot "System32\cmd.exe") /c ('"' + (Join-Path $root "lanfu.cmd") + '" --version > "' + $bannerFile + '" 2>nul')
          $banner = if (Test-Path $bannerFile) { (Get-Content $bannerFile -Raw -Encoding UTF8).Trim() } else { "" }
          Write-Output ("[smoke] banner: " + $banner)
          $expectedBanner = "LanFu ${{ needs.resolve.outputs.version }} (core "
          if (-not $banner.StartsWith($expectedBanner)) { Fail "CLI banner is '$banner'; expected it to start with '$expectedBanner'" }
          if ($banner -match "OpenClaw") { Fail "CLI banner still shows the upstream brand: '$banner'" }
          Step "CLI banner shows LanFu <version> (core ...)"

          Step "checking the installer pre-wired the connection"
          if (-not (Test-Path $gatewayConfig)) { Fail "gateway config missing" }
          $cfg = Get-Content $gatewayConfig -Raw | ConvertFrom-Json
          if (-not $cfg.gateway.auth.token) { Fail "gateway auth token missing" }
          if ($cfg.gateway.auth.token -ne $legacyToken) { Fail "the legacy token must be preserved, not re-minted (got: $($cfg.gateway.auth.token))" }
          Step "legacy token preserved"

          Step "checking the company model preset"
          if (-not $cfg.models.providers.vllm) { Fail "company model provider not seeded" }
          if ($cfg.models.providers.vllm.baseUrl -ne "http://100.116.120.40:8000/v1") { Fail "vllm baseUrl mismatch: $($cfg.models.providers.vllm.baseUrl)" }
          if (@($cfg.models.providers.vllm.models).Count -lt 2) { Fail "model catalog missing entries" }
          if ($cfg.agents.defaults.model -ne "vllm/qwen38") { Fail "default model not set: $($cfg.agents.defaults.model)" }
          if ($cfg.update.auto.enabled -ne $false) { Fail "gateway auto-update must stay off the upstream channel" }
          Step "company model preset (qwen38/qwen38-think) and default model in place"

          Step "checking the memory and permission presets"
          if ($cfg.memory.search.model -ne "bge-m3") { Fail "memory embedding model not preset: $($cfg.memory.search.model)" }
          if ($cfg.memory.search.store.fts.tokenizer -ne "trigram") { Fail "memory fts tokenizer must be trigram for Chinese" }
          if ($cfg.memory.search.enabled -ne $true) { Fail "memory must be enabled by default" }
          if ($cfg.tools.exec.mode -ne "auto") { Fail "exec default must be workspace (auto), got: $($cfg.tools.exec.mode)" }
          Step "memory preset (bge-m3 + trigram) and workspace exec default in place"

          $shellRegistry = Join-Path $env:APPDATA "LanFu\gateways.json"
          if (-not (Test-Path $shellRegistry)) { Fail "shell connection record missing" }
          $reg = Get-Content $shellRegistry -Raw | ConvertFrom-Json
          if (-not $reg.gateways -or -not $reg.gateways[0]) { Fail "connection record has no gateways" }
          if ($reg.activeId -ne $reg.gateways[0].id) { Fail "connection record activeId mismatch" }
          if ($reg.gateways[0].url -ne "ws://127.0.0.1:18789") { Fail "connection record url mismatch: $($reg.gateways[0].url)" }
          if ($reg.gateways[0].isLocal -ne $false) { Fail "isLocal must be false; true takes the v2 signature path and never connects" }
          Step "connection record wired (isLocal=False)"

          $envDump = Join-Path $env:TEMP "lanfu-install-context.txt"
          if (Test-Path $envDump) { Fail "the environment dump is back; 0.4.1 installs left one and uninstall never removed it" }
          Step "no environment dump"

          Step "checking workspace templates are packaged"
          foreach ($tpl in @("AGENTS.md", "SOUL.md", "IDENTITY.md", "USER.md")) {
            if (-not (Test-Path (Join-Path $root "app\docs\reference\templates\$tpl"))) { Fail "workspace template missing from payload: $tpl (every agent turn needs it)" }
          }
          Step "workspace templates packaged"

          Step "waiting for the desktop shell pairing"
          $paired = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $out = (& (Join-Path $env:SystemRoot "System32\cmd.exe") /c ('"' + (Join-Path $root "lanfu.cmd") + '" devices list --json')) 2>$null | Out-String
            $idx = $out.IndexOf("{")
            if ($idx -lt 0) { continue }
            try { $d = $out.Substring($idx) | ConvertFrom-Json } catch { continue }
            if ((@($d.pending).Count -eq 0) -and (@($d.paired).Count -gt 0)) { $paired = $true; break }
          }
          if (-not $paired) { Fail "the desktop shell never completed pairing (installer-side approval did not land)" }
          Step "desktop shell paired with the gateway"

          Step "checking the assistant identity preset"
          # Redirect the JSON to a file INSIDE cmd: bytes hit disk untouched, so no
          # console-codepage decode can mangle the Chinese identity on the way in.
          # (Setting [Console]::OutputEncoding on the headless runner truncated the
          # capture to "["; JSON-object parsing then failed on shapes the debug
          # print showed as valid - so assert on the decoded TEXT, not objects.)
          $agentsFile = Join-Path $env:TEMP "lanfu-agents.json"
          Remove-Item $agentsFile -Force -ErrorAction SilentlyContinue
          $null = & (Join-Path $env:SystemRoot "System32\cmd.exe") /c ('"' + (Join-Path $root "lanfu.cmd") + '" agents list --json > "' + $agentsFile + '" 2>nul')
          $agentOk = $false
          $agentsOut = ""
          if (Test-Path $agentsFile) { $agentsOut = Get-Content $agentsFile -Raw -Encoding UTF8 }
          # Encoding-agnostic textual contract: on a fresh install nothing but the
          # installer preset produces a config-sourced identity. The preset carries
          # the brand mark as a same-origin avatar path and deliberately no emoji.
          if (($agentsOut -match '"identitySource"\s*:\s*"config"') -and
              ($agentsOut -match '"identityName"\s*:\s*"[^"]+"') -and
              ($agentsOut -match '"identityAvatarUrl"\s*:\s*"/lanfu-mark\.png"') -and
              ($agentsOut -notmatch '"identityEmoji"\s*:\s*"."[^"]*"')) { $agentOk = $true }
          if (-not $agentOk) {
            Write-Output ("[smoke] agents list raw (identity check): " + $agentsOut.Substring(0, [Math]::Min(600, $agentsOut.Length)))
            Fail "the Xiaolan assistant identity was not preset"
          }
          Step "assistant identity preset (小蓝)"

          Step "checking the desktop shell"
          $shellExe = Join-Path $env:LOCALAPPDATA "LanFu\LanFu.exe"
          if (-not (Test-Path $shellExe)) { Fail "desktop shell was not installed" }
          Step "desktop shell installed"
          # The shell renders its brand-mark fallbacks (agent badge, owner card) from
          # ms-appx:///Assets/lanfu-mark.png. That asset is caught by the fork's blanket
          # *.png .gitignore rule, so 0.4.9 shipped without it and both fallbacks rendered
          # empty. Assert it is in the installed payload so it can never go missing again.
          $brandMark = Join-Path $env:LOCALAPPDATA "LanFu\Assets\lanfu-mark.png"
          if (-not (Test-Path $brandMark)) { Fail "the desktop shell is missing its bundled brand mark (Assets\lanfu-mark.png); badge/owner fallbacks would render empty" }
          $trimmedAssembly = Join-Path $env:LOCALAPPDATA "LanFu\PresentationFramework.dll"
          if (Test-Path $trimmedAssembly) { Fail "unused WPF assemblies were not trimmed from the shell payload" }
          Step "desktop shell payload trimmed"
          Step "desktop shell ships the bundled brand mark"

          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "LanFu.lnk"
          if (-not (Test-Path $shortcut)) { Fail "desktop shortcut is missing" }
          Step "desktop shortcut present"

          $autostart = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup\LanFu.lnk"
          if (-not (Test-Path $autostart)) { Fail "desktop shell autostart shortcut is missing" }
          $runKey = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "LanFuGateway" -ErrorAction SilentlyContinue
          if (-not $runKey.LanFuGateway) { Fail "gateway autostart entry is missing" }
          if ($runKey.LanFuGateway -notmatch "ensure-gateway") { Fail "gateway autostart must point at the retrying watchdog script" }
          Step "autostart registered for both the gateway and the shell"

          $shell = Get-Process -Name "LanFu" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $shell) { Write-Output "[smoke] note: the shell process is not running (headless runner); the installer did try to launch it" }
          else { Step "desktop shell launched by the installer" }

          # Upgrade path regression: install the same build a second time over the
          # installed tree. [InstallDelete] clears app\dist before extraction, so
          # hash-named chunks must not accumulate (0.4.20 reached 707 MB of dist with
          # 424 MB orphaned chunks; 0.4.21 fixed that). Without this check a future
          # packaging change could silently bring the bloat back.
          Step "reinstalling to check upgrade cleanup"
          Get-Process -Name "LanFu" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $distRoot = Join-Path $root "app\dist"
          $filesBefore = (Get-ChildItem $distRoot -Recurse -File | Measure-Object).Count
          $chunksBefore = (Get-ChildItem $distRoot -Recurse -File -Filter "official-external-provider-catalog-*.mjs" | Measure-Object).Count
          # 0.4.35: seed a fake Inno orphan before the reinstall; [InstallDelete]
          # must remove it (a real machine accumulated a 92.8MB is-*.tmp in runtime
          # because upgrades never cleaned Inno's interrupted-extraction leftovers).
          $innoOrphan = Join-Path $root "runtime\is-SMOKETEST.tmp"
          "smoke-orphan" | Set-Content $innoOrphan
          $proc2 = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOCANCEL","/LOG=$setupLog") -PassThru
          if (-not $proc2.WaitForExit(1800000)) { try { $proc2.Kill() } catch { }; Fail "second installer run did not finish within 30 minutes" }
          if ($proc2.ExitCode -ne 0) { Fail "second installer returned $($proc2.ExitCode)" }
          if (Test-Path $innoOrphan) { Fail "runtime is-*.tmp orphan survived the reinstall; [InstallDelete] cleanup regressed" }
          $filesAfter = (Get-ChildItem $distRoot -Recurse -File | Measure-Object).Count
          $chunksAfter = (Get-ChildItem $distRoot -Recurse -File -Filter "official-external-provider-catalog-*.mjs" | Measure-Object).Count
          Write-Output ("[smoke] dist files $filesBefore -> $filesAfter; catalog chunk copies $chunksBefore -> $chunksAfter")
          if ($chunksAfter -ne 1) { Fail "upgrade cleanup did not run: $chunksAfter copies of the catalog chunk remain" }
          if ($filesAfter -gt [math]::Ceiling($filesBefore * 1.02)) { Fail "dist file count grew during reinstall: $filesBefore -> $filesAfter" }
          $readyAgain = $false
          for ($i = 0; $i -lt 48; $i++) { Start-Sleep -Seconds 5; try { $r = Invoke-WebRequest "http://127.0.0.1:18789/" -UseBasicParsing -TimeoutSec 4; if ($r.StatusCode -eq 200) { $readyAgain = $true; break } } catch { } }
          if (-not $readyAgain) { Fail "gateway did not become ready after the upgrade reinstall" }
          Step "upgrade cleanup keeps dist flat and the gateway healthy"

          Step "cleaning up"
          Get-Process -Name "LanFu" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "LanFuGateway" -ErrorAction SilentlyContinue
          Step "done"
  linux-deb:
    name: Linux package
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}
          cache: pnpm
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: lanfu-dist
      - name: Extract dist
        run: tar -xzf dist.tar.gz
      - name: Switch the workspace to a flat dependency layout
        run: |
          sed -i 's/^nodeLinker: isolated$/nodeLinker: hoisted/' pnpm-workspace.yaml
          grep -q 'nodeLinker: hoisted' pnpm-workspace.yaml
          grep -q 'allowUnusedPatches' pnpm-workspace.yaml || echo 'allowUnusedPatches: true' >> pnpm-workspace.yaml
      - name: Install flat production dependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Stamp the LanFu product version
        run: node scripts/stamp-product-version.mjs "${{ needs.resolve.outputs.version }}"
      - name: Stage the application tree
        run: |
          mkdir -p release/app
          cp -r dist release/app/dist
          cp -r node_modules release/app/node_modules
          cp *.mjs release/app/
          for f in package.json LICENSE THIRD_PARTY_NOTICES.md; do [ -f "$f" ] && cp "$f" release/app/; done
          rm -rf release/app/node_modules/@openclaw/ai
          mkdir -p release/app/node_modules/@openclaw/ai
          cp -r packages/ai/dist release/app/node_modules/@openclaw/ai/dist
          cp packages/ai/package.json release/app/node_modules/@openclaw/ai/package.json
          for p in @openai/codex-linux-x64 @anthropic-ai/claude-agent-sdk-linux-x64 @github/copilot-sdk-linux-x64 onnxruntime-node @lancedb/lancedb-linux-x64-gnu; do rm -rf "release/app/node_modules/$p"; done
          # Workspace templates are runtime data (see the windows-exe note).
          mkdir -p release/app/docs/reference
          cp -r docs/reference/templates release/app/docs/reference/
      - name: Download the pinned Node runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_RUNTIME_VERSION }}/node-v${{ env.NODE_RUNTIME_VERSION }}-linux-x64.tar.xz" -o node.tar.xz
          mkdir -p release/runtime && tar -xJf node.tar.xz --strip-components=1 -C release/runtime
          # Same trim as Windows: keep node + LICENSE, drop the npm toolchain/headers.
          rm -rf release/runtime/lib/node_modules release/runtime/include release/runtime/share/doc release/runtime/share/man
          rm -f release/runtime/bin/npm release/runtime/bin/npx release/runtime/bin/corepack release/runtime/CHANGELOG.md release/runtime/README.md
      - name: Assemble the release root
        run: cp packaging/linux/usr/bin/lanfu release/ && cp packaging/linux/usr/lib/systemd/user/lanfu-gateway.service release/
      - name: Build the deb
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          ROOT="deb-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/opt/lanfu" "$ROOT/usr/bin" "$ROOT/usr/lib/systemd/user" "$ROOT/DEBIAN"
          cp -r release/. "$ROOT/opt/lanfu/"
          cp packaging/linux/usr/bin/lanfu "$ROOT/usr/bin/lanfu"
          cp packaging/linux/usr/lib/systemd/user/lanfu-gateway.service "$ROOT/usr/lib/systemd/user/lanfu-gateway.service"
          printf "Package: lanfu\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: LanFu\nDescription: LanFu company AI assistant\n" "$VERSION" > "$ROOT/DEBIAN/control"
          mkdir -p release-assets
          dpkg-deb --build --root-owner-group "$ROOT" "release-assets/lanfu_${VERSION}_amd64.deb"
      - name: Checksums
        run: |
          cd release-assets && sha256sum *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lanfu-linux-${{ needs.resolve.outputs.version }}
          path: release-assets/**

  release:
    name: Publish release
    needs: [resolve, build, windows-exe, linux-deb]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      # Checkout MUST run before download-artifact: checkout's default clean
      # step would delete the released assets downloaded into the workspace
      # (0.4.16 shipped an asset-less release that way).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # Each release must say what THIS version changed. The body comes from
      # docs/lanfu/releases/<version>.md (written when the version is bumped);
      # the old fixed installer blurb is gone because the in-app update dialog
      # shows this body verbatim, and repeating the same text every time is noise.
      - name: Release notes
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          mkdir -p out
          NOTES="docs/lanfu/releases/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > "out/RELEASE_NOTES.md"
          else
            {
              echo "# LanFu $VERSION"
              echo ""
              echo "本版未填写更新说明，详见仓库发布说明。"
            } > "out/RELEASE_NOTES.md"
            echo "::warning::missing release notes file $NOTES"
          fi
          cp release-assets/* out/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          # Publish under the tag that triggered the run (v0.4.7+ is the
          # updater-native form; a hardcoded lanfu-v prefix once silently
          # retagged a v-tagged release into a form the updater cannot parse).
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.resolve.outputs.version) }}
          name: LanFu ${{ needs.resolve.outputs.version }}
          # Published, not draft: employees download the asset straight from the
          # release page, and draft releases are invisible to them.
          draft: false
          body_path: out/RELEASE_NOTES.md
          files: |
            out/*.exe
            out/*.deb
            out/SHA256SUMS.txt
