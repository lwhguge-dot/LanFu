name: LanFu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanfu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux typecheck and targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsgo:core
      - run: pnpm exec vitest run src/cli/program/error-output.test.ts src/config/state-dir.test.ts

  windows:
    name: Windows compatibility tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/infra/windows-process-start.test.ts src/infra/windows-encoding.test.ts src/cli/completion-runtime.windows.test.ts
